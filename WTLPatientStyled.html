<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contact Ocubio - Patient</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family: Arial, Helvetica, sans-serif;
    background:#f3f3f3;
    color:#222;
}

.page-container{
    max-width:900px;
    margin:80px auto;
    padding:0 20px;
}

.page-title{
    text-align:center;
    font-size:58px;
    font-weight:300;
    margin-bottom:10px;
}

.page-title strong{
    font-weight:700;
}

.subtitle{
    text-align:center;
    font-size:18px;
    margin-bottom:40px;
}

.form-card{
    max-width:700px;
    margin:0 auto;
    background:#f7f7f7;
    border:1px solid #d9d9d9;
    border-radius:12px;
    padding:30px;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
}

.full-width{
    grid-column:1 / -1;
}

input,
select{
    width:100%;
    height:50px;
    padding:0 14px;
    border:1px solid #cfcfcf;
    border-radius:3px;
    font-size:15px;
    background:white;
}

.submit-btn{
    margin-top:20px;
    background:#3f7de8;
    color:white;
    border:none;
    border-radius:8px;
    padding:15px 60px;
    font-size:16px;
    cursor:pointer;
}

.submit-btn:hover{
    background:#2d69d1;
}

.consent-section{
    margin-top:24px;
    padding-top:20px;
    border-top:1px solid #ddd;
}

.checkbox-group{
    display:flex;
    align-items:flex-start;
    gap:10px;
    margin-bottom:14px;
    line-height:1.5;
    font-size:15px;
}

.checkbox-group input[type="checkbox"]{
    width:auto;
    height:auto;
    margin-top:3px;
    flex-shrink:0;
}

.consent-note{
    margin-top:8px;
    font-size:13px;
    color:#666;
    font-style:italic;
}

@media(max-width:768px){
    .form-grid{
        grid-template-columns:1fr;
    }

    .page-title{
        font-size:42px;
    }
}
</style>
</head>

<body>

<div class="page-container">

    <h1 class="page-title">Contact <strong>Ocubio</strong></h1>

    <p class="subtitle">
        Please complete the form below for questions about products, orders or general inquiries.
    </p>

    <div class="form-card">

        <form action="https://test.salesforce.com/servlet/servlet.WebToLead?encoding=UTF-8&orgId=00DOu00000Dccfu" method="POST">

            <input type="hidden" name="oid" value="00DOt00000zGuRV">
            <input type="hidden" name="retURL" value="https://patients.ocubio.com/thank-you">

            <input type="hidden" name="debug" value="0">
            <input type="hidden" name="debugEmail" value="marcoivan.mejia@nuvolar.com">

            <input type="hidden" id="country_code" name="country_code" value="US">
            <input type="hidden" id="00NOt00000TRSyv" name="00NOt00000TRSyv" value="Patient"> <!-- Lead Type -->
            <input type="hidden" id="00NOt00000TRSz0" name="00NOt00000TRSz0" value="website"> <!-- UTM Source -->
            <input type="hidden" id="00NOt00000TRSyz" name="00NOt00000TRSyz" value="organic"> <!-- UTM Medium -->
            <input type="hidden" id="00NOt00000TRSyy" name="00NOt00000TRSyy" value="contact_us"> <!-- UTM Campaign -->
            <input type="hidden" id="00NOt00000TRSyu" name="00NOt00000TRSyu" value="https://ocubio.com/contact-us/"> <!-- Landing URL -->
            <input type="hidden" id="lead_source" name="lead_source" value="Web">
            <input type="hidden" id="00NOt00000TRSyt" name="00NOt00000TRSyt" value="High"> <!-- Duplicate Confidence -->

            <div class="form-grid">

                <input id="first_name" name="first_name" maxlength="40" placeholder="First Name" required>

                <input id="last_name" name="last_name" maxlength="80" placeholder="Last Name" required>

                <input id="email" name="email" maxlength="80" placeholder="Email">

                <input id="mobile" name="mobile" maxlength="40" placeholder="Phone" required>

                <select id="state_code" name="state_code" required>
                    <option value="">State / Province</option>
                    <option value="AL">Alabama</option>
                    <option value="AK">Alaska</option>
                    <option value="AZ">Arizona</option>
                    <option value="AR">Arkansas</option>
                    <option value="CA">California</option>
                    <option value="CO">Colorado</option>
                    <option value="CT">Connecticut</option>
                    <option value="DE">Delaware</option>
                    <option value="DC">District of Columbia</option>
                    <option value="FL">Florida</option>
                    <option value="GA">Georgia</option>
                    <option value="HI">Hawaii</option>
                    <option value="ID">Idaho</option>
                    <option value="IL">Illinois</option>
                    <option value="IN">Indiana</option>
                    <option value="IA">Iowa</option>
                    <option value="KS">Kansas</option>
                    <option value="KY">Kentucky</option>
                    <option value="LA">Louisiana</option>
                    <option value="ME">Maine</option>
                    <option value="MD">Maryland</option>
                    <option value="MA">Massachusetts</option>
                    <option value="MI">Michigan</option>
                    <option value="MN">Minnesota</option>
                    <option value="MS">Mississippi</option>
                    <option value="MO">Missouri</option>
                    <option value="MT">Montana</option>
                    <option value="NE">Nebraska</option>
                    <option value="NV">Nevada</option>
                    <option value="NH">New Hampshire</option>
                    <option value="NJ">New Jersey</option>
                    <option value="NM">New Mexico</option>
                    <option value="NY">New York</option>
                    <option value="NC">North Carolina</option>
                    <option value="ND">North Dakota</option>
                    <option value="OH">Ohio</option>
                    <option value="OK">Oklahoma</option>
                    <option value="OR">Oregon</option>
                    <option value="PA">Pennsylvania</option>
                    <option value="PR">Puerto Rico</option>
                    <option value="RI">Rhode Island</option>
                    <option value="SC">South Carolina</option>
                    <option value="SD">South Dakota</option>
                    <option value="TN">Tennessee</option>
                    <option value="TX">Texas</option>
                    <option value="UT">Utah</option>
                    <option value="VT">Vermont</option>
                    <option value="VA">Virginia</option>
                    <option value="WA">Washington</option>
                    <option value="WV">West Virginia</option>
                    <option value="WI">Wisconsin</option>
                    <option value="WY">Wyoming</option>
                </select>

            </div>
            <div class="consent-section">
                <label class="checkbox-group">
                    <input
                        id="00NOt00000TYm9Z"
                        name="00NOt00000TYm9Z"
                        type="checkbox"
                        value="1">            
                    <span>
                        Text me updates from Ocubio. Msg &amp; data rates may apply, reply STOP to cancel.
                    </span>
                </label>
            
                <label class="checkbox-group">
                    <input
                        id="00NOt00000TYm1V"
                        name="00NOt00000TYm1V"
                        type="checkbox"
                        value="1">
            
                    <span>
                        Email me updates from Ocubio.
                    </span>
                </label>

                <p class="consent-note">
                    *Please don't share personal health info by text or email.
                </p>

            </div>
            <button type="submit" class="submit-btn">
                Submit
            </button>

        </form>

    </div>

</div>

</body>
</html>
