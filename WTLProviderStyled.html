<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contact Ocubio - Provider</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family: Arial, Helvetica, sans-serif;
    background:#f3f3f3;
    color:#222;
}

.page-container{
    max-width:900px;
    margin:80px auto;
    padding:0 20px;
}

.page-title{
    text-align:center;
    font-size:58px;
    font-weight:300;
    margin-bottom:10px;
}

.page-title strong{
    font-weight:700;
}

.subtitle{
    text-align:center;
    font-size:18px;
    margin-bottom:40px;
}

.form-card{
    max-width:700px;
    margin:0 auto;
    background:#f7f7f7;
    border:1px solid #d9d9d9;
    border-radius:12px;
    padding:30px;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
}

input,
select{
    width:100%;
    height:50px;
    padding:0 14px;
    border:1px solid #cfcfcf;
    border-radius:3px;
    font-size:15px;
    background:white;
}

.submit-btn{
    margin-top:20px;
    background:#3f7de8;
    color:white;
    border:none;
    border-radius:8px;
    padding:15px 60px;
    font-size:16px;
    cursor:pointer;
}

.submit-btn:hover{
    background:#2d69d1;
}

@media(max-width:768px){
    .form-grid{
        grid-template-columns:1fr;
    }

    .page-title{
        font-size:42px;
    }
}
</style>
</head>

<body>

<div class="page-container">

    <h1 class="page-title">Contact <strong>Ocubio</strong></h1>

    <p class="subtitle">
        Please complete the form below for provider inquiries.
    </p>

    <div class="form-card">

        <form action="https://test.salesforce.com/servlet/servlet.WebToLead?encoding=UTF-8&orgId=00DOu00000Dccfu" method="POST">

            <input type="hidden" name="oid" value="00DOu00000Dccfu">
            <input type="hidden" name="retURL" value="https://ocubio.com/contact-us/?">

            <input type="hidden" name="debug" value="1">
            <input type="hidden" name="debugEmail" value="marcoivan.mejia@nuvolar.com">

            <input type="hidden" id="country_code" name="country_code" value="US">

            <input type="hidden" id="00NOu000009DERO" name="00NOu000009DERO" value="Provider">
            <input type="hidden" id="00NOu000009DeP3" name="00NOu000009DeP3" value="website">
            <input type="hidden" id="00NOu000009DeLp" name="00NOu000009DeLp" value="organic">
            <input type="hidden" id="00NOu000009DeKD" name="00NOu000009DeKD" value="contact_us">
            <input type="hidden" id="00NOu000009DFNS" name="00NOu000009DFNS" value="https://ocubio.com/contact-us/">
            <input type="hidden" id="lead_source" name="lead_source" value="Web">

            <div class="form-grid">

                <input id="first_name" name="first_name" maxlength="40" placeholder="First Name" required>

                <input id="last_name" name="last_name" maxlength="80" placeholder="Last Name" required>

                <input id="email" name="email" maxlength="80" placeholder="Email" required>

                <input id="mobile" name="mobile" maxlength="40" placeholder="Phone" required>

                <input id="company" name="company" maxlength="40" placeholder="Practice Name" required>

                <input id="00NOu000009Dek2" name="00NOu000009Dek2" maxlength="20" placeholder="NPI Number" required>

                <input id="00NOu000009Da5T" name="00NOu000009Da5T" maxlength="255" placeholder="Specialty">

                <select id="state_code" name="state_code" required>
                    <option value="">State / Province</option>
                    <option value="AL">Alabama</option>
                    <option value="AK">Alaska</option>
                    <option value="AZ">Arizona</option>
                    <option value="AR">Arkansas</option>
                    <option value="CA">California</option>
                    <option value="CO">Colorado</option>
                    <option value="CT">Connecticut</option>
                    <option value="DE">Delaware</option>
                    <option value="DC">District of Columbia</option>
                    <option value="FL">Florida</option>
                    <option value="GA">Georgia</option>
                    <option value="HI">Hawaii</option>
                    <option value="ID">Idaho</option>
                    <option value="IL">Illinois</option>
                    <option value="IN">Indiana</option>
                    <option value="IA">Iowa</option>
                    <option value="KS">Kansas</option>
                    <option value="KY">Kentucky</option>
                    <option value="LA">Louisiana</option>
                    <option value="ME">Maine</option>
                    <option value="MD">Maryland</option>
                    <option value="MA">Massachusetts</option>
                    <option value="MI">Michigan</option>
                    <option value="MN">Minnesota</option>
                    <option value="MS">Mississippi</option>
                    <option value="MO">Missouri</option>
                    <option value="MT">Montana</option>
                    <option value="NE">Nebraska</option>
                    <option value="NV">Nevada</option>
                    <option value="NH">New Hampshire</option>
                    <option value="NJ">New Jersey</option>
                    <option value="NM">New Mexico</option>
                    <option value="NY">New York</option>
                    <option value="NC">North Carolina</option>
                    <option value="ND">North Dakota</option>
                    <option value="OH">Ohio</option>
                    <option value="OK">Oklahoma</option>
                    <option value="OR">Oregon</option>
                    <option value="PA">Pennsylvania</option>
                    <option value="PR">Puerto Rico</option>
                    <option value="RI">Rhode Island</option>
                    <option value="SC">South Carolina</option>
                    <option value="SD">South Dakota</option>
                    <option value="TN">Tennessee</option>
                    <option value="TX">Texas</option>
                    <option value="UT">Utah</option>
                    <option value="VT">Vermont</option>
                    <option value="VA">Virginia</option>
                    <option value="WA">Washington</option>
                    <option value="WV">West Virginia</option>
                    <option value="WI">Wisconsin</option>
                    <option value="WY">Wyoming</option>
                </select>

            </div>

            <button type="submit" class="submit-btn">
                Submit
            </button>

        </form>

    </div>

</div>

</body>
</html>
